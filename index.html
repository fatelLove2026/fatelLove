<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#7c3aed">
  <title>حاسبة نسبة الحب | فاضل نجم</title>
  <style>
    :root{
      --bg1:#120b2b; --bg2:#24104f; --card:rgba(255,255,255,.10);
      --border:rgba(255,255,255,.18); --text:#fff; --muted:#d8cfee;
      --accent:#a855f7; --pink:#ec4899; --shadow:0 25px 70px rgba(0,0,0,.35);
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      margin:0; min-height:100vh; color:var(--text);
      font-family:Tahoma,"Segoe UI",Arial,sans-serif;
      background:
        radial-gradient(circle at 15% 15%, rgba(236,72,153,.28), transparent 28%),
        radial-gradient(circle at 85% 85%, rgba(99,102,241,.28), transparent 30%),
        linear-gradient(135deg,var(--bg1),var(--bg2));
      overflow-x:hidden;
    }
    body::before,body::after{
      content:""; position:fixed; border-radius:50%; filter:blur(2px);
      pointer-events:none; z-index:0; opacity:.55; animation:float 9s ease-in-out infinite;
    }
    body::before{width:220px;height:220px;background:rgba(236,72,153,.12);top:8%;right:-70px}
    body::after{width:280px;height:280px;background:rgba(124,58,237,.13);bottom:-100px;left:-80px;animation-delay:-3s}
    .hearts{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
    .heart{position:absolute;bottom:-40px;font-size:18px;opacity:0;animation:rise linear infinite}
    .heart:nth-child(1){right:8%;animation-duration:8s;animation-delay:1s}
    .heart:nth-child(2){right:23%;animation-duration:11s;animation-delay:3s}
    .heart:nth-child(3){right:67%;animation-duration:9s;animation-delay:5s}
    .heart:nth-child(4){right:87%;animation-duration:12s;animation-delay:2s}
    .heart:nth-child(5){right:45%;animation-duration:10s;animation-delay:7s}
    .wrap{position:relative;z-index:1;width:min(940px,92%);margin:auto;padding:42px 0 28px}
    .brand{text-align:center;margin-bottom:28px;animation:fadeDown .8s ease both}
    .badge{
      display:inline-flex;align-items:center;gap:9px;padding:8px 15px;border:1px solid var(--border);
      border-radius:999px;background:rgba(255,255,255,.07);backdrop-filter:blur(12px);
      color:#f5ddff;font-size:13px;margin-bottom:15px;
    }
    h1{margin:0;font-size:clamp(28px,5vw,46px);letter-spacing:-1px}
    .en{margin-top:8px;font-size:17px;color:#ddcff7;direction:ltr}
    .card{
      border:1px solid var(--border);background:var(--card);backdrop-filter:blur(22px);
      -webkit-backdrop-filter:blur(22px);border-radius:30px;padding:clamp(22px,5vw,44px);
      box-shadow:var(--shadow);animation:fadeUp .9s .1s ease both;
    }
    .title{text-align:center;margin:0;font-size:clamp(22px,4vw,32px)}
    .subtitle{text-align:center;color:var(--muted);margin:10px auto 30px;line-height:1.8}
    .form{
      display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:end;
    }
    .field label{display:block;margin:0 0 9px;font-weight:700;font-size:14px;color:#eee4ff}
    input{
      width:100%;height:58px;border:1px solid rgba(255,255,255,.2);border-radius:17px;
      outline:none;background:rgba(0,0,0,.18);color:#fff;padding:0 17px;font-size:17px;
      transition:.25s;
    }
    input::placeholder{color:#a99cbd}
    input:focus{border-color:#d08cff;box-shadow:0 0 0 4px rgba(168,85,247,.15);transform:translateY(-1px)}
    .vs{align-self:center;margin-bottom:8px;width:42px;height:42px;display:grid;place-items:center;
      border-radius:50%;background:linear-gradient(135deg,var(--pink),var(--accent));font-size:19px;
      box-shadow:0 8px 25px rgba(236,72,153,.3)}
    .actions{display:flex;justify-content:center;gap:12px;margin-top:22px;flex-wrap:wrap}
    button{
      border:0;border-radius:16px;min-height:54px;padding:0 24px;font-size:16px;font-weight:800;
      cursor:pointer;color:#fff;transition:transform .2s,box-shadow .2s,opacity .2s;
      font-family:inherit;
    }
    button:hover{transform:translateY(-3px)}
    button:active{transform:translateY(0) scale(.98)}
    .calc{background:linear-gradient(135deg,#ec4899,#8b5cf6);box-shadow:0 12px 30px rgba(168,85,247,.3)}
    .clear{background:rgba(255,255,255,.09);border:1px solid var(--border)}
    .result{
      margin-top:26px;padding:25px;border-radius:24px;text-align:center;
      background:linear-gradient(145deg,rgba(236,72,153,.13),rgba(124,58,237,.13));
      border:1px solid rgba(255,255,255,.15);display:none;animation:pop .55s ease both;
    }
    .result.show{display:block}
    .result h3{margin:0 0 5px;font-size:21px}
    .names{color:var(--muted);font-size:14px;margin-bottom:15px}
    .score{
      font-size:clamp(55px,12vw,86px);font-weight:900;line-height:1;
      background:linear-gradient(135deg,#fff,#f0abfc,#f9a8d4);
      -webkit-background-clip:text;background-clip:text;color:transparent;
      direction:ltr;display:inline-block;
    }
    .percent{font-size:30px;font-weight:800;color:#ffd3eb}
    .message{margin:14px auto 0;max-width:650px;line-height:1.9;color:#f4eaff}
    .bar{height:10px;background:rgba(255,255,255,.1);border-radius:99px;overflow:hidden;margin:20px auto 0;max-width:600px}
    .fill{height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#ec4899,#a855f7,#6366f1);transition:width 1.1s cubic-bezier(.2,.8,.2,1)}
    footer{text-align:center;color:#b9acd0;font-size:12px;margin-top:20px}
    .shake{animation:shake .35s ease}
    @keyframes fadeDown{from{opacity:0;transform:translateY(-18px)}to{opacity:1;transform:none}}
    @keyframes fadeUp{from{opacity:0;transform:translateY(25px)}to{opacity:1;transform:none}}
    @keyframes pop{0%{opacity:0;transform:scale(.94)}100%{opacity:1;transform:scale(1)}}
    @keyframes float{50%{transform:translateY(-25px) translateX(15px)}}
    @keyframes rise{0%{transform:translateY(0) rotate(0);opacity:0}15%{opacity:.55}100%{transform:translateY(-110vh) rotate(25deg);opacity:0}}
    @keyframes shake{25%{transform:translateX(-5px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}
    @media(max-width:700px){
      .wrap{padding-top:25px}
      .card{border-radius:24px}
      .form{grid-template-columns:1fr;gap:12px}
      .vs{margin:0 auto;width:38px;height:38px}
      .actions button{width:100%}
      .subtitle{margin-bottom:22px}
    }
  </style>
</head>
<body>
  <div class="hearts" aria-hidden="true">
    <span class="heart">♥</span><span class="heart">♡</span><span class="heart">♥</span>
    <span class="heart">♡</span><span class="heart">♥</span>
  </div>

  <main class="wrap">
    <header class="brand">
      <div class="badge">💜 موقع تفاعلي للحب والتوافق</div>
      <h1>الوكيل فاضل نجم</h1>
      <div class="en">Fadel Najm</div>
    </header>

    <section class="card">
      <h2 class="title">اكتشف نسبة التوافق بين اسمين ✨</h2>
      <p class="subtitle">اكتب الاسمين ودع الحاسبة تمنحكما نسبة توافق مرحة ❤️</p>

      <div class="form">
        <div class="field">
          <label for="name1">الاسم الأول</label>
          <input id="name1" type="text" autocomplete="off" placeholder="مثلاً: فاضل">
        </div>
        <div class="vs">♥</div>
        <div class="field">
          <label for="name2">الاسم الثاني</label>
          <input id="name2" type="text" autocomplete="off" placeholder="مثلاً: سارة">
        </div>
      </div>

      <div class="actions">
        <button class="calc" id="calculate">احسب نسبة الحب ❤️</button>
        <button class="clear" id="clear">مسح 🗑️</button>
      </div>

      <div class="result" id="result" aria-live="polite">
        <h3>نتيجة التوافق 💞</h3>
        <div class="names" id="pair"></div>
        <div><span class="score" id="score">0</span><span class="percent">%</span></div>
        <div class="message" id="message"></div>
        <div class="bar"><div class="fill" id="fill"></div></div>
      </div>
    </section>

    <footer>© <span id="year"></span> Fadel Najm — تجربة ترفيهية للتوافق بين الأسماء</footer>
  </main>

  <script>
    const name1 = document.getElementById('name1');
    const name2 = document.getElementById('name2');
    const result = document.getElementById('result');
    const scoreEl = document.getElementById('score');
    const fill = document.getElementById('fill');
    const message = document.getElementById('message');
    const pair = document.getElementById('pair');

    document.getElementById('year').textContent = new Date().getFullYear();

    function clean(s) {
      return s.trim().replace(/\s+/g, ' ');
    }

    // نتيجة ثابتة لنفس الاسمين، حتى لا تتغير النسبة عند إعادة الحساب.
    function loveScore(a, b) {
      const text = [a, b].sort((x,y) => x.localeCompare(y, 'ar')).join('|');
      let hash = 2166136261;
      for (let i = 0; i < text.length; i++) {
        hash ^= text.charCodeAt(i);
        hash = Math.imul(hash, 16777619);
      }
      const raw = (hash >>> 0) % 71;
      return 30 + raw; // 30% إلى 100%
    }

    function getMessage(score) {
      if (score >= 90) return "توافق استثنائي! 💖 يبدو أن بين الاسمين انسجاماً رائعاً جداً.";
      if (score >= 80) return "توافق جميل جداً! 💕 هناك طاقة إيجابية وانسجام واضح.";
      if (score >= 70) return "توافق قوي! ❤️ بداية رائعة لقصة مليئة بالمشاعر الجميلة.";
      if (score >= 60) return "توافق لطيف! 💗 مع قليل من الاهتمام والتفاهم قد يصبح أجمل.";
      if (score >= 50) return "هناك شرارة جميلة! ✨ التفاهم هو المفتاح لصناعة التوافق.";
      return "توافق قابل للتحسن! 🌷 فالأجمل دائماً هو ما يصنعه القلب والاحترام.";
    }

    function calculate() {
      const a = clean(name1.value);
      const b = clean(name2.value);

      if (!a || !b) {
        [name1, name2].forEach(el => {
          if (!clean(el.value)) {
            el.classList.remove('shake');
            void el.offsetWidth;
            el.classList.add('shake');
          }
        });
        return;
      }

      const score = loveScore(a, b);
      pair.textContent = `${a}  ❤️  ${b}`;
      message.textContent = getMessage(score);
      result.classList.add('show');

      scoreEl.textContent = '0';
      fill.style.width = '0%';

      let current = 0;
      const duration = 850;
      const start = performance.now();

      function animate(now) {
        const p = Math.min((now - start) / duration, 1);
        const eased = 1 - Math.pow(1 - p, 3);
        current = Math.round(score * eased);
        scoreEl.textContent = current;
        fill.style.width = current + '%';
        if (p < 1) requestAnimationFrame(animate);
      }
      requestAnimationFrame(animate);
    }

    function clearAll() {
      name1.value = '';
      name2.value = '';
      result.classList.remove('show');
      scoreEl.textContent = '0';
      fill.style.width = '0%';
      message.textContent = '';
      pair.textContent = '';
      name1.focus();
    }

    document.getElementById('calculate').addEventListener('click', calculate);
    document.getElementById('clear').addEventListener('click', clearAll);

    [name1, name2].forEach(input => {
      input.addEventListener('keydown', e => {
        if (e.key === 'Enter') calculate();
      });
    });
  </script>
</body>
</html>
